<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim | Ahmet Abdulhalaf</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
            <div class="container">
                <a class="navbar-brand" href="index.html">WebProje</a>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Hakkında</a></li>
                        <li class="nav-item"><a class="nav-link" href="cv.html">Özgeçmiş</a></li>
                        <li class="nav-item"><a class="nav-link" href="sehrim.html">Şehrim</a></li>
                        <li class="nav-item"><a class="nav-link" href="mirasimiz.html">Mirasımız</a></li>
                        <li class="nav-item"><a class="nav-link" href="ilgi-alanlarim.html">İlgi Alanlarım</a></li>
                        <li class="nav-item"><a class="nav-link active" href="iletisim.html">İletişim</a></li>
                        <li class="nav-item"><a class="nav-link btn btn-primary text-white ms-lg-2" href="login.html">Login</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 bg-white p-5 rounded shadow-sm">
                <h2 class="fw-bold mb-4 text-center text-primary">İletişim Formu</h2>
                
                <form id="contactForm" onsubmit="return validateForm()">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Adınız</label>
                            <input type="text" class="form-control" id="firstName" placeholder="Örn: Ahmet">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Soyadınız</label>
                            <input type="text" class="form-control" id="lastName" placeholder="Örn: Abdulhalaf">
                        </div>
                        <div class="col-12">
                            <label class="form-label">E-posta Adresiniz</label>
                            <input type="email" class="form-control" id="email" placeholder="isim@ornek.com">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Mesajınız</label>
                            <textarea class="form-control" id="message" rows="4" placeholder="Mesajınızı buraya yazın..."></textarea>
                        </div>
                        <div class="col-12 mt-4 d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4">Gönder</button>
                            <button type="reset" class="btn btn-outline-secondary px-4">Temizle</button>
                        </div>
                    </div>
                </form>
                
                <div id="feedback" class="mt-3"></div>
            </div>
        </div>
    </main>

    <footer class="py-4 mt-5 bg-dark text-white text-center">
        <p class="m-0 small">© 2026 Ahmet Abdulhalaf - İletişim Sayfası</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        function validateForm() {
            const firstName = document.getElementById('firstName').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            const feedback = document.getElementById('feedback');

            if (firstName === "" || email === "" || message === "") {
                feedback.innerHTML = '<div class="alert alert-danger">Lütfen tüm alanları doldurunuz!</div>';
                return false;
            }

            if (!email.includes("@")) {
                feedback.innerHTML = '<div class="alert alert-danger">Geçerli bir e-posta adresi giriniz!</div>';
                return false;
            }

            feedback.innerHTML = '<div class="alert alert-success">Mesajınız başarıyla alındı!</div>';
            return true;
        }
    </script>
</body>
</html>
