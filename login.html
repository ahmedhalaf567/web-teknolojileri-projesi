<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | Web Projesi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
            <div class="container">
                <a class="navbar-brand" href="index.html">WebProje</a>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Hakkında</a></li>
                        <li class="nav-item"><a class="nav-link" href="cv.html">Özgeçmiş</a></li>
                        <li class="nav-item"><a class="nav-link" href="sehrim.html">Şehrim</a></li>
                        <li class="nav-item"><a class="nav-link" href="mirasimiz.html">Mirasımız</a></li>
                        <li class="nav-item"><a class="nav-link" href="ilgi-alanlarim.html">İlgi Alanlarım</a></li>
                        <li class="nav-item"><a class="nav-link" href="iletisim.html">İletişim</a></li>
                        <li class="nav-item"><a class="nav-link active btn btn-primary text-white ms-lg-2" href="login.html">Login</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container login-container">
        <div class="row w-100 justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card login-card">
                    <div class="card-body p-5">
                        <h3 class="text-center fw-bold mb-4">Öğrenci Paneli</h3>
                        
                        <form id="loginForm" onsubmit="return handleLogin(event)">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">E-posta (SAÜ)</label>
                                <input type="email" id="userEmail" class="form-control" placeholder="b251210559@sakarya.edu.tr" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-bold">Şifre</label>
                                <input type="password" id="userPass" class="form-control" placeholder="Şifreniz" required>
                            </div>
                            <button type="submit" class="btn btn-login btn-primary w-100">Giriş</button>
                        </form>
                        
                        <div id="loginFeedback" class="mt-3 text-center small"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-4 bg-dark text-white text-center">
        <p class="m-0 small">© 2026 Ahmet Abdulhalaf - Web Teknolojileri Projesi</p>
    </footer>

    <script>
        // Giriş butonuna basınca kontrolleri yapıyoruz
        function handleLogin(event) {
            event.preventDefault(); // Sayfanın yenilenmesini durdurdum hocam
            
            const email = document.getElementById('userEmail').value;
            const pass = document.getElementById('userPass').value;
            const feedback = document.getElementById('loginFeedback');

            // Kullanıcı adı SAÜ maili mi ve şifre girilmiş mi diye bakıyoruz
            if (email.includes("@sakarya.edu.tr") && pass !== "") {
                // E-postanın başındaki öğrenci numarasını çekip hoş geldin diyoruz
                const studentNo = email.split('@')[0];
                feedback.innerHTML = '<span class="text-success fw-bold">Hoşgeldiniz ' + studentNo + '! Giriş başarılı.</span>';
                
                // 1.5 saniye sonra ana sayfaya yönlendiriyoruz
                setTimeout(() => {
                    window.location.href = "index.html"; 
                }, 1500);
                
            } else {
                // Hatalı durumda kırmızı mesaj
                feedback.innerHTML = '<span class="text-danger">Hata: Lütfen geçerli bir SAÜ maili girin!</span>';
            }
        }
    </script>
</body>
</html>
